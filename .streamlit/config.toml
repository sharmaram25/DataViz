# DataViz design system — native Streamlit theme.
# Colour roles:
#   brand / interactive  → blue        (one accent, used sparingly)
#   status               → green / yellow / orange / red  (meaning only, always with icon + label)
#   canvas               → warm neutral greys (recede behind the data)
#   sidebar              → deep navy (frames the workspace, high contrast navigation)

[theme]
base = "light"
primaryColor = "#1f6bcf"
backgroundColor = "#f7f7f5"
secondaryBackgroundColor = "#ffffff"
textColor = "#1b1b1a"
linkColor = "#1f6bcf"
borderColor = "#e1e0d9"
showWidgetBorder = true
dataframeBorderColor = "#e9e8e2"
dataframeHeaderBackgroundColor = "#f3f2ee"
dataframeHeaderTextColor = "#52514e"
baseRadius = "10px"
buttonRadius = "9px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFontWeights = [800, 700, 650, 600, 600, 600]
codeFont = "monospace"
baseFontSize = 15
metricValueFontWeight = 700

# Semantic / status colours (validated status palette)
blueColor = "#2a78d6"
blueTextColor = "#1c5cab"
blueBackgroundColor = "#e8f1fc"
greenColor = "#0ca30c"
greenTextColor = "#006300"
greenBackgroundColor = "#e6f5e6"
yellowColor = "#fab219"
yellowTextColor = "#7a5200"
yellowBackgroundColor = "#fff5dc"
orangeColor = "#ec835a"
orangeTextColor = "#9c3d12"
orangeBackgroundColor = "#fdeee7"
redColor = "#d03b3b"
redTextColor = "#a82626"
redBackgroundColor = "#fbe9e9"
violetColor = "#6250d6"
violetTextColor = "#4a3aa7"
violetBackgroundColor = "#efedfb"

chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]
chartSequentialColors = ["#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#5598e7", "#3987e5", "#2a78d6", "#256abf", "#1c5cab"]

[theme.sidebar]
backgroundColor = "#0f1c2e"
secondaryBackgroundColor = "#172a42"
textColor = "#dfe6ef"
primaryColor = "#6aa8f5"
borderColor = "#24384f"
linkColor = "#8dbcf7"
greenTextColor = "#5fd35f"
yellowTextColor = "#ffd27a"
redTextColor = "#ff8f8f"
blueTextColor = "#9cc6fa"

[server]
headless = true
maxUploadSize = 500
runOnSave = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[global]
# Widget values are deliberately re-seeded from session state so they survive page switches.
disableWidgetStateDuplicationWarning = true
